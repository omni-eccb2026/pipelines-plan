name: scRNA Benchmark (pipelines)
id: pipelines-plan
description: "Benchmarking scRNA pipelines (as implemented by Billato et al.: 10.1101/2025.10.28.681564)"
benchmarker: Atreya Choudhury, Mark Robinson, Martin Emons, David Wissel, Samuel Gunz
version: "1.0"

software_backend: apptainer
software_environments:
  r_apptainer:
    name: R apptainer
    apptainer: oras://quay.io/omnibenchmark/scrna-bench:r-bioc-320-latest-amd64
  py_apptainer_rsc_0.13.5:
    name: python apptainer with rsc v0.13.5
    apptainer: oras://quay.io/omnibenchmark/scrna-bench:py-rsc-0.13.5-latest-amd64
  py_apptainer_rsc_0.14.1:
    name: python apptainer with rsc v0.14.1
    apptainer: oras://quay.io/omnibenchmark/scrna-bench:py-rsc-0.14.1-latest-amd64

metric_collectors:
  - id: report
    name: Gathers and processes metrics from different pipelines
    software_environment: r_apptainer
    repository:
      url: https://github.com/scrna-bench/pipelines-report
      commit: a13c22b
    inputs:
      - metrics.metrics
    outputs:
      - id: report.metrics
        path: "report/metrics.tsv"
      - id: report.timings
        path: "report/timings.tsv"
      - id: report.plots
        path: "report/plots.html"

stages:
  - id: datasets
    outputs:
      - id: data.h5ad
        path: "{dataset}.h5ad"
      - id: data.clusters_truth
        path: "{dataset}.clusters_truth.tsv"
    modules:
      - id: datasets-r
        name: loads scRNA datasets
        software_environment: r_apptainer
        repository:
          url: https://github.com/scrna-bench/datasets
          commit: 960d54b
        parameters:
          - dataset_name: ["sc-mix", "be1", "cb"]
          # - dataset_name: ["sc-mix", "be1", "cb", "1.3m"]
  - id: methods
    inputs:
      - data.h5ad
    outputs:
      - id: methods.timings
        path: "{dataset}.timings.json"
      - id: methods.resolutions
        path: "{dataset}.resolutions.json"
      - id: methods.clusters
        path: "{dataset}.clusters.tsv"
      - id: methods.pca
        path: "{dataset}.pca.tsv"
    modules:
      - id: pipelines-r
        name: run R pipelines
        software_environment: r_apptainer
        repository:
          url: https://github.com/scrna-bench/pipelines-r
          commit: 9731100
        parameters:
          - method_name: ["seurat", "osca", "scrapper"]
            n_cluster: [5, 7, 9, 11]
            filter: ["manual", "auto"]
            n_comp: [20, 30, 50]
            n_neig: [10, 15, 20, 30]
            n_hvg: [1000, 1500, 2000]
      - id: pipelines-py
        name: run python pipelines
        software_environment: py_apptainer_rsc_0.14.1
        repository:
          url: https://github.com/scrna-bench/pipelines-py
          commit: 4abf1ab
        parameters:
          - method_name: ["scanpy", "rapids"]
            n_cluster: [5, 7, 9, 11]
            filter: "manual"
            n_comp: [20, 30, 50]
            n_neig: [10, 15, 20, 30]
            n_hvg: [1000, 1500, 2000]
      - id: pipelines-py-old
        name: run python pipelines with older rapids-singlecell
        software_environment: py_apptainer_rsc_0.13.5
        repository:
          url: https://github.com/scrna-bench/pipelines-py
          commit: 4abf1ab
        parameters:
          - method_name: "rapids"
            n_cluster: [5, 7, 9, 11]
            filter: "manual"
            n_comp: 30
            n_neig: 20
            n_hvg: 1000
  - id: metrics
    inputs:
      - data.clusters_truth
      - methods.pca
      - methods.clusters
      - methods.timings
      - methods.resolutions
    outputs:
      - id: metrics.metrics
        path: "{dataset}.metrics.json"
    modules:
      - id: metrics-py
        name: compute clustering metrics
        software_environment: py_apptainer_rsc_0.14.1
        repository:
          url: https://github.com/scrna-bench/metrics
          commit: eceb84e
