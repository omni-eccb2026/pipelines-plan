name: scRNA Benchmark (pipelines)
id: pipelines-plan
description: "Benchmarking scRNA pipelines (as implemented by Billato et al.: 10.1101/2025.10.28.681564)"
benchmarker: Atreya Choudhury, Mark Robinson, Martin Emons, David Wissel, Samuel Gunz

# Benchmark configuration
version: "1.2"
api_version: "0.4.0"

provenance:
  canonical_url: https://raw.githubusercontent.com/omni-eccb2026/pipelines-plan/refs/heads/main/benchmark.yaml

# Available software environments
software_backend: conda
software_environments:
  r_osta:
    name: conda env for R/BioC + osta packages
    conda: envs/r_osta.yml
  scanpy:
    name: conda env for Python + scanpy packages
    conda: envs/scanpy.yml
  metrics:
    name: conda env for Python + metrics packages
    conda: envs/metrics.yml

