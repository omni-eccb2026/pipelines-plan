stages:
  - id: datasets
    outputs:
      - id: data.h5ad
        path: "{dataset}.h5ad"
      - id: data.clusters_truth
        path: "{dataset}.clusters_truth.tsv"
      - id: data.clusters_truth_num
        path: "{dataset}.clusters_truth_num.txt"
    modules:
      - id: datasets-r
        name: loads scRNA datasets
        software_environment: r_osta
        repository:
          url: https://github.com/omni-eccb2026/datasets
          commit: 65d18ae
        parameters:
          - dataset_name: ["sc-mix"]
          # - dataset_name: ["sc-mix", "be1", "cb", "1.3m"]
  - id: methods
    inputs:
      - data.h5ad
      - data.clusters_truth_num
    outputs:
      - id: methods.timings
        path: "{dataset}.timings.json"
      - id: methods.clustering_info
        path: "{dataset}.clustering_info.json"
      - id: methods.clusters
        path: "{dataset}.clusters.tsv"
      - id: methods.pca
        path: "{dataset}.pca.tsv"
    modules:
      - id: osta-r
        name: run R pipelines
        software_environment: r_osta
        repository:
          url: https://github.com/omni-eccb2026/pipelines-r
          commit: 33129f6
        parameters:
          - method_name: ["osca"]
            d_cluster: [0]
            filter: ["manual"]
            n_comp: [30]
            n_neig: [20]
            n_hvg: [1500]
          #- method_name: ["seurat", "osca", "scrapper"]
          #  d_cluster: [-2, -1, 0, 1, 2]
          #  filter: ["manual", "auto"]
          #  n_comp: [20, 30, 50]
          #  n_neig: [10, 15, 20, 30]
          #  n_hvg: [1000, 1500, 2000]
      - id: scanpy
        name: run python pipelines
        software_environment: scanpy
        repository:
          url: https://github.com/omni-eccb2026/pipelines-py
          commit: 104a39d
        parameters:
          - method_name: ["scanpy"]
            d_cluster: [0]
            filter: "manual"
            n_comp: [30]
            n_neig: [20]
            n_hvg: [1500]
  - id: metrics
    inputs:
      - data.clusters_truth
      - methods.pca
      - methods.clusters
      - methods.timings
      - methods.clustering_info
    outputs:
      - id: metrics.metrics
        path: "{dataset}.metrics.json"
    modules:
      - id: metrics-py
        name: compute clustering metrics
        software_environment: metrics
        repository:
          url: https://github.com/omni-eccb2026/metrics
          commit: a97c3d8
