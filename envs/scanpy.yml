name: py-rapids-scanpy
# Conda equivalent of envs/py.def
#   (Apptainer: rapidsai/base:26.02-cuda12-py3.12 + pinned pip stack,
#    https://github.com/scrna-bench/pipelines-plan/blob/main/envs/py.def)
#
#   mamba env create -f py-rapids-scanpy.yml
#   conda activate py-rapids-scanpy
#
# Requires an NVIDIA GPU + driver supporting CUDA 12 (linux-64 only).
# All version pins below were checked to exist in the listed channels.

channels:
  #- rapidsai
  - conda-forge

dependencies:
  # ---- interpreter / CUDA (replaces the rapidsai/base:26.02-cuda12-py3.12 image) ----
  - python=3.12
  #- cuda-version=12.9
  #- cupy>=13.6,<15

  # ---- RAPIDS 26.02 (the parts rapids-singlecell uses) ----
  #- rmm=26.02.*
  #- cudf=26.02.*
  #- cuml=26.02.*
  #- cugraph=26.02.*
  #- pylibraft=26.02.*
  #- cuvs=26.02.*

  # ---- build tooling / system libs (the %post apt-get block) ----
  - c-compiler
  - cxx-compiler
  - fortran-compiler
  - cmake
  - make
  - pkg-config
  - git
  - hdf5
  - libopenblas
  - igraph
  - libxml2
  - glpk
  - gmp

  # ---- packaging ----
  - pip=25.0.1
  - setuptools=75.8.2
  - wheel=0.45.1

  # ---- pinned scientific stack (exact versions from py.def) ----
  - six=1.17.0
  - packaging=24.2
  - pyparsing=3.2.1
  - python-dateutil=2.9.0.post0
  - pytz=2024.1
  - tzdata
  - colorama=0.4.6
  - exceptiongroup=1.2.2
  - cached-property=1.5.2
  - array-api-compat=1.11
  - numpy=2.1.3
  - llvmlite=0.44.0
  - numba=0.61.0
  - scipy=1.15.2
  - pandas=2.2.3
  - threadpoolctl=3.5.0
  - joblib=1.4.2
  - scikit-learn=1.6.1
  - contourpy=1.3.1
  - cycler=0.12.1
  - fonttools=4.56.0
  - kiwisolver=1.4.8
  - munkres=1.1.4
  - pillow=11.1.0
  - matplotlib=3.10.1
  - seaborn=0.13.2
  - h5py=3.13.0
  - natsort=8.4.0
  - networkx=3.4.2
  - pynndescent=0.5.13
  - umap-learn=0.5.7
  - texttable=1.7.0
  - python-igraph=0.11.8
  - leidenalg=0.10.2
  - louvain=0.8.2
  - patsy=1.0.1
  - statsmodels=0.14.4
  - tqdm=4.67.1
  - anndata=0.11.3
  - openpyxl=3.1.5
  - et_xmlfile=2.0.0
  - session-info=1.0.0
  - stdlib-list=0.11.1
  - legacy-api-wrap=1.4.1
  - unicodedata2=16.0.0
  - scanpy=1.10.4

  # ---- not packaged for conda ----
  - pip:
      - rapids-singlecell==0.14.1

variables:
  LC_ALL: C.UTF-8
  LANG: C.UTF-8

