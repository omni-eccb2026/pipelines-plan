name: r-report
# Environment for the `report` metric collector (scrna-bench/pipelines-report).
#
#   mamba env create -f r_report.yml
#   conda activate r-report
#
# This replaces the `r_apptainer` environment the collector block used to name.
# Porting that image was never necessary: run.R needs argparse + jsonlite, and
# plots.Rmd needs dplyr, tidyr, ggplot2, readr, scales and knitr. There is no
# Bioconductor in the collector at all, so none of the r_osta stack applies.
#
# pandoc is not an R package but rmarkdown::render() shells out to it, and a
# conda env does not inherit the host's copy. Leaving it out is the one failure
# that only shows up at the very last line of the run.

channels:
  - conda-forge

dependencies:
  - r-base=4.4

  # ---- run.R ----
  - r-argparse=2.2.5
  - r-jsonlite=1.9.1

  # ---- plots.Rmd ----
  - r-rmarkdown=2.29
  - r-knitr=1.50
  - r-dplyr=1.1.4
  - r-tidyr=1.3.1
  - r-ggplot2=3.5.1
  - r-readr=2.1.5
  - r-scales=1.3.0

  # ---- rmarkdown::render() dependency, not an R package ----
  - pandoc=3.6.3
