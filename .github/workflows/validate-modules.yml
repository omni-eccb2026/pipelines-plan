name: Validate Modules

on:
  pull_request:
    paths:
      - benchmark.yaml
  workflow_dispatch:

jobs:
  validate-modules:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Pixi
        run: |
          curl -fsSL https://pixi.sh/install.sh | bash
          echo "$HOME/.pixi/bin" >> $GITHUB_PATH

      - name: Clone omnibenchmark repository
        run: |
          git clone --branch dev --depth 1 https://github.com/omnibenchmark/omnibenchmark.git omnibenchmark-repo

      - name: Install omnibenchmark with Pixi
        working-directory: omnibenchmark-repo
        run: |
          pixi install

      - name: Install yq for YAML parsing
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Extract and clone module repositories
        run: |
          mkdir -p modules
          : > modules/repos_to_validate.txt
          : > modules/seen_repo_commits.txt

          # Extract repository URLs and commits from benchmark.yaml.
          # Skip duplicates explicitly with a seen repo+commit list.
          yq eval '.stages[].modules[] | [.repository.url, .repository.commit] | join("\t")' benchmark.yaml | while IFS=$'\t' read -r url commit; do
            if [ -n "$url" ] && [ "$url" != "null" ] && [ -n "$commit" ] && [ "$commit" != "null" ]; then
              key="${url}@${commit}"
              if grep -Fxq "$key" modules/seen_repo_commits.txt; then
                echo "Skipping duplicate repository+commit: $key"
                continue
              fi
              echo "$key" >> modules/seen_repo_commits.txt

              repo_name=$(basename "$url" .git)
              clone_dir="modules/${repo_name}_${commit}"

              echo "Cloning $url at commit $commit into $clone_dir"
              git clone "$url" "$clone_dir"
              cd "$clone_dir"
              git checkout "$commit"
              cd ../..

              # Store the mapping for validation
              echo "$clone_dir" >> modules/repos_to_validate.txt
            fi
          done

      - name: Validate all modules
        run: |
          if [ -f modules/repos_to_validate.txt ]; then
            while read -r module_path; do
              echo "Validating module: $module_path"
              cd omnibenchmark-repo
              pixi run ob validate module "../$module_path"
              cd ..
            done < modules/repos_to_validate.txt
          else
            echo "No modules to validate"
          fi
